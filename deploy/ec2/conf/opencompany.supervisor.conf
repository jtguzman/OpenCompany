; OpenCompany single-port runtime, supervised the same way the cobranza app
; on this host is (one supervisor program per app, logs under /var/log/<app>).
;
; This is the same process ``company serve`` launches -- uvicorn serving the
; REST API + WebSocket + the built SPA on one port -- invoked through the
; server venv's interpreter directly so the unit has no runtime dependency on
; ``uv`` (or on the root node_modules that the CLI's build check requires).
;
; ``__OC_PORT__`` is substituted by bootstrap.sh from PYTHON_BACKEND_PORT in
; the deployed .env; there is no port literal in this file.
[program:opencompany]
command=/opt/opencompany/server/.venv/bin/python -m uvicorn main:app --host 127.0.0.1 --port __OC_PORT__ --log-level warning
directory=/opt/opencompany/server
user=appuser
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
; uvicorn traps SIGINT for a graceful shutdown; the process group stop keeps
; the on-demand Node sidecar from being orphaned.
stopsignal=INT
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1",PYTHONUTF8="1",SERVE_STATIC_CLIENT="1",PORT="__OC_PORT__",HOME="/home/appuser",PATH="/usr/local/bin:/usr/bin:/bin"
stdout_logfile=/var/log/opencompany/app.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/opencompany/error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
